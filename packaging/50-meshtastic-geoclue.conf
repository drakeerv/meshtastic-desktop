# Allow the Meshtastic desktop client to read the host location without an
# authorization-agent prompt. GeoClue and GeoClue-compatible services read
# application sections from /etc/geoclue/geoclue.conf and the drop-ins in
# /etc/geoclue/conf.d/.
#
# Install as /etc/geoclue/conf.d/50-meshtastic.conf (scripts/install-geoclue.sh
# does this for you), then restart the service or let D-Bus reactivate it.
[org.meshtastic.Meshtastic]
allowed=true
system=false
users=
